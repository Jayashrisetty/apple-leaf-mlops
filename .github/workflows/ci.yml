name: AppleLeaf9 CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt

      - name: Install DVC with Google Drive support
        run: |
          python -m pip install --upgrade pip
          pip install "cryptography==46.0.7"
          pip install "pyOpenSSL==25.3.0"
          pip install "dvc[gdrive]"

      - name: Verify Python files
        run: |
          python -m py_compile api/app.py
          python -m py_compile scripts/*.py

      - name: Verify DVC configuration
        run: |
          test -f data.dvc
          test -f .dvc/config

  docker:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install DVC with Google Drive support
        run: |
          python -m pip install --upgrade pip
          pip install "cryptography==46.0.7"
          pip install "pyOpenSSL==25.3.0"
          pip install "dvc[gdrive]"

      - name: Verify crypto versions
        run: |
          python -c "import cryptography; print('cryptography:', cryptography.__version__)"
          python -c "import OpenSSL; print('pyOpenSSL:', OpenSSL.__version__)"

      - name: Configure DVC service account
        env:
          GDRIVE_CREDENTIALS_DATA: ${{ secrets.GDRIVE_CREDENTIALS_DATA }}
        run: |
          printf '%s' "$GDRIVE_CREDENTIALS_DATA" > "$RUNNER_TEMP/gdrive-service-account.json"

          dvc remote modify --local gdrive_remote gdrive_use_service_account true
          dvc remote modify --local gdrive_remote gdrive_service_account_json_file_path "$RUNNER_TEMP/gdrive-service-account.json"

      - name: Pull model from DVC
        run: |
          dvc pull --verbose

      - name: Verify model exists
        run: |
          test -f models/appleleaf9_improved_best.keras
          test -f models/improved_class_names.json
          ls -lh models/

      - name: Build Docker image
        run: |
          docker build -t appleleaf9-api:ci .
```
