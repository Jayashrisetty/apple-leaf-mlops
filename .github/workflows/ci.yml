name: AppleLeaf9 CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  # ============================================================
  # TEST JOB
  # ============================================================
  test:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # 2. Setup Python
      # --------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # --------------------------------------------------------
      # 3. Install dependencies
      # --------------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          pip install dvc==3.67.1
          pip install dvc-gdrive

          pip install "pyOpenSSL>=25.0.0"
          pip install "cryptography>=43.0.0"

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

          pip install pytest

      # --------------------------------------------------------
      # 4. Verify Python and packages
      # --------------------------------------------------------
      - name: Verify Python and packages
        run: |
          echo "=============================="
          echo "PYTHON VERSION"
          echo "=============================="
          python --version

          echo "=============================="
          echo "PIP VERSION"
          echo "=============================="
          pip --version

          echo "=============================="
          echo "DVC VERSION"
          echo "=============================="
          dvc --version

          echo "=============================="
          echo "CRYPTOGRAPHY"
          echo "=============================="
          python -c "import cryptography; print('cryptography:', cryptography.__version__)"

          echo "=============================="
          echo "PYOPENSSL"
          echo "=============================="
          python -c "import OpenSSL; print('pyOpenSSL:', OpenSSL.__version__)"

      # --------------------------------------------------------
      # 5. Create Google Drive credentials
      # --------------------------------------------------------
      - name: Create Google Drive credentials
        env:
          GCP_SERVICE_ACCOUNT_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
        run: |

          echo "=============================="
          echo "CHECKING GOOGLE CREDENTIALS"
          echo "=============================="

          if [ -z "$GCP_SERVICE_ACCOUNT_KEY" ]; then
            echo "ERROR: GCP_SERVICE_ACCOUNT_KEY is empty."
            exit 1
          fi

          printf '%s' "$GCP_SERVICE_ACCOUNT_KEY" \
            > "$RUNNER_TEMP/gdrive-service-account.json"

          echo "Google service-account JSON file created."

          echo "=============================="
          echo "VALIDATING JSON"
          echo "=============================="

          python - <<'PY'
          import json
          import os

          path = os.path.join(
              os.environ["RUNNER_TEMP"],
              "gdrive-service-account.json"
          )

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          if data.get("type") != "service_account":
              raise ValueError(
                  "ERROR: Secret is not a Google service-account JSON."
              )

          required = [
              "project_id",
              "private_key",
              "client_email"
          ]

          for key in required:
              if not data.get(key):
                  raise ValueError(
                      f"ERROR: Missing required field: {key}"
                  )

          print("SUCCESS: Google service-account JSON is valid.")
          print("Service account:", data["client_email"])
          print("Project ID:", data["project_id"])
          PY

      # --------------------------------------------------------
      # 6. Configure DVC Google Drive
      # --------------------------------------------------------
      - name: Configure DVC Google Drive
        run: |

          echo "=============================="
          echo "CONFIGURING DVC GOOGLE DRIVE"
          echo "=============================="

          dvc remote modify gdrive_remote \
            gdrive_service_account_json_file_path \
            "$RUNNER_TEMP/gdrive-service-account.json"

          echo "DVC Google Drive authentication configured."

      # --------------------------------------------------------
      # 7. Check DVC configuration
      # --------------------------------------------------------
      - name: Check DVC configuration
        run: |

          echo "=============================="
          echo "DVC REMOTES"
          echo "=============================="

          dvc remote list

          echo "=============================="
          echo "DVC GDRIVE URL"
          echo "=============================="

          dvc remote get-url gdrive_remote

      # --------------------------------------------------------
      # 8. Pull dataset from Google Drive
      # --------------------------------------------------------
      - name: Pull DVC data
        run: |

          echo "=============================="
          echo "PULLING DATA FROM GOOGLE DRIVE"
          echo "=============================="

          dvc pull --verbose

      # --------------------------------------------------------
      # 9. Verify dataset
      # --------------------------------------------------------
      - name: Verify dataset
        run: |

          echo "=============================="
          echo "VERIFYING DATASET"
          echo "=============================="

          if [ -d "data" ]; then

            echo "SUCCESS: Data directory exists."

            echo "=============================="
            echo "DATA FILES"
            echo "=============================="

            find data -maxdepth 2 -type f | head -20

          else

            echo "ERROR: data directory was not created."
            exit 1

          fi

      # --------------------------------------------------------
      # 10. Run tests
      # --------------------------------------------------------
      - name: Run tests
        run: |

          echo "=============================="
          echo "RUNNING TESTS"
          echo "=============================="

          if [ -d "tests" ]; then

            echo "Tests directory found."
            pytest tests -v

          else

            echo "No tests directory found."
            echo "Skipping pytest."

          fi


  # ============================================================
  # DOCKER JOB
  # ============================================================
  docker:
    needs: test
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # 11. Checkout repository
      # --------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # 12. Login to Docker Hub
      # --------------------------------------------------------
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # --------------------------------------------------------
      # 13. Build Docker image
      # --------------------------------------------------------
      - name: Build Docker image
        run: |

          echo "=============================="
          echo "BUILDING DOCKER IMAGE"
          echo "=============================="

          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/apple-leaf-mlops:latest \
            .

      # --------------------------------------------------------
      # 14. Push Docker image
      # --------------------------------------------------------
      - name: Push Docker image
        run: |

          echo "=============================="
          echo "PUSHING DOCKER IMAGE"
          echo "=============================="

          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/apple-leaf-mlops:latest

          echo "=============================="
          echo "DOCKER IMAGE PUSHED SUCCESSFULLY"
          echo "=============================="