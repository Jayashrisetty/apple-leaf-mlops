name: AppleLeaf9 CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  test:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          echo "========================================"
          echo "INSTALLING DEPENDENCIES"
          echo "========================================"

          python -m pip install --upgrade pip

          echo "Installing DVC..."
          pip install "dvc==3.67.1"

          echo "Installing DVC Google Drive support..."
          pip install "dvc-gdrive"

          if [ -f requirements.txt ]; then
            echo "Installing project requirements..."
            pip install -r requirements.txt
          else
            echo "requirements.txt not found."
          fi

          echo "Installing compatible Google Drive dependencies..."
          pip install --force-reinstall \
            "PyDrive2==1.21.3" \
            "pyOpenSSL==24.2.1" \
            "cryptography==43.0.3"

          echo "Installing pytest..."
          pip install pytest

      - name: Verify Python and packages
        run: |
          echo "========================================"
          echo "PYTHON VERSION"
          echo "========================================"
          python --version

          echo "========================================"
          echo "DVC VERSION"
          echo "========================================"
          dvc --version

          echo "========================================"
          echo "PYDRIVE2 VERSION"
          echo "========================================"
          python -c "import pydrive2; print('PyDrive2:', getattr(pydrive2, '__version__', 'installed'))"

          echo "========================================"
          echo "PYOPENSSL VERSION"
          echo "========================================"
          python -c "import OpenSSL; print('pyOpenSSL:', OpenSSL.__version__)"

          echo "========================================"
          echo "CRYPTOGRAPHY VERSION"
          echo "========================================"
          python -c "import cryptography; print('cryptography:', cryptography.__version__)"

          echo "========================================"
          echo "CHECKING OpenSSL.crypto.sign"
          echo "========================================"
          python -c "from OpenSSL import crypto; print('crypto.sign available:', hasattr(crypto, 'sign'))"
  # ============================================================
  # DOCKER JOB
  # ============================================================

  docker:
    needs: test
    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------------------------
      # 12. Checkout repository
      # ----------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # 13. Login to Docker Hub
      # ----------------------------------------------------------

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ----------------------------------------------------------
      # 14. Build Docker image
      # ----------------------------------------------------------

      - name: Build Docker image
        run: |
          echo "========================================"
          echo "BUILDING DOCKER IMAGE"
          echo "========================================"

          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/apple-leaf-mlops:latest \
            .

      # ----------------------------------------------------------
      # 15. Push Docker image
      # ----------------------------------------------------------

      - name: Push Docker image
        run: |
          echo "========================================"
          echo "PUSHING DOCKER IMAGE"
          echo "========================================"

          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/apple-leaf-mlops:latest

          echo "Docker image pushed successfully."
