name: AppleLeaf9 CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  # ============================================================
  # TEST JOB
  # ============================================================
  test:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # 3. Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          pip install dvc==3.67.1
          pip install dvc-gdrive

          pip install "pyOpenSSL>=25.0.0"
          pip install "cryptography>=43.0.0"

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

          pip install pytest

      # 4. Verify Python and packages
      - name: Verify Python and packages
        run: |
          python --version
          pip --version
          dvc --version

          python -c "import cryptography; print('cryptography:', cryptography.__version__)"
          python -c "import OpenSSL; print('pyOpenSSL:', OpenSSL.__version__)"

      # 5. Create Google Drive credentials
      - name: Create Google Drive credentials
        env:
          GCP_SERVICE_ACCOUNT_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
        run: |

          if [ -z "$GCP_SERVICE_ACCOUNT_KEY" ]; then
            echo "ERROR: GCP_SERVICE_ACCOUNT_KEY secret is empty."
            exit 1
          fi

          printf '%s' "$GCP_SERVICE_ACCOUNT_KEY" \
            > "$RUNNER_TEMP/gdrive-service-account.json"

          echo "Checking Google service-account JSON..."

          python - <<'PY'
          import json
          import os

          path = os.path.join(
              os.environ["RUNNER_TEMP"],
              "gdrive-service-account.json"
          )

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          if data.get("type") != "service_account":
              raise ValueError(
                  "ERROR: Secret is not a service-account JSON."
              )

          required = [
              "project_id",
              "private_key",
              "client_email"
          ]

          for key in required:
              if not data.get(key):
                  raise ValueError(
                      f"ERROR: Missing required field: {key}"
                  )

          print("Google service-account JSON is valid.")
          print("Service account:", data["client_email"])
          PY

      # 6. Configure DVC Google Drive
      - name: Configure DVC Google Drive
        run: |
          dvc remote modify gdrive \
            gdrive_service_account_json_file_path \
            "$RUNNER_TEMP/gdrive-service-account.json"

      # 7. Check DVC configuration
      - name: Check DVC configuration
        run: |
          echo "=============================="
          echo "DVC REMOTES"
          echo "=============================="

          dvc remote list

          echo "=============================="
          echo "DVC GDRIVE URL"
          echo "=============================="

          dvc remote get-url gdrive

      # 8. Pull dataset
      - name: Pull DVC data
        run: |
          echo "=============================="
          echo "PULLING DATA FROM GOOGLE DRIVE"
          echo "=============================="

          dvc pull --verbose

      # 9. Verify dataset
      - name: Verify dataset
        run: |

          echo "=============================="
          echo "VERIFYING DATASET"
          echo "=============================="

          if [ -d "data" ]; then
            echo "Data directory exists."

            echo "Files:"
            find data -maxdepth 2 -type f | head -20

          else
            echo "ERROR: data directory was not created."
            exit 1
          fi

      # 10. Run tests
      - name: Run tests
        run: |

          echo "=============================="
          echo "RUNNING TESTS"
          echo "=============================="

          if [ -d "tests" ]; then
            pytest tests -v
          else
            echo "No tests directory found."
            echo "Skipping pytest."
          fi


  # ============================================================
  # DOCKER JOB
  # ============================================================
  docker:
    needs: test
    runs-on: ubuntu-latest

    steps:

      # 11. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 12. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 13. Build Docker image
      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/apple-leaf-mlops:latest \
            .

      # 14. Push Docker image
      - name: Push Docker image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/apple-leaf-mlops:latest